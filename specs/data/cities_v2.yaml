# City pool for instances/v2/. Loosens capacity_buffer 1.40 -> 2.50 so
# route-count stops being capacity-pinned. v1 finding: at N=50, all 8
# cities hit the same 11-route floor regardless of any solver/cost
# intervention. v2 should produce 6-10 routes typical, with real
# choice in the route-count axis.
cities:
  - name: "Manhattan, NY"
    query: "Manhattan, New York, USA"
    topology: grid_oneway
  - name: "Paris, France"
    query: "Paris, France"
    topology: radial
  - name: "San Francisco, CA"
    query: "San Francisco, California, USA"
    topology: coastal_constrained
  - name: "Phoenix, AZ"
    query: "Phoenix, Arizona, USA"
    topology: sprawl
  - name: "Charleston, SC"
    query: "Charleston, South Carolina, USA"
    topology: colonial_dense
  - name: "Austin, TX"
    query: "Austin, Texas, USA"
    topology: midsize_grid
  - name: "Pittsburgh, PA"
    query: "Pittsburgh, Pennsylvania, USA"
    topology: midsize_radial
  - name: "Cambridge, MA"
    query: "Cambridge, Massachusetts, USA"
    topology: oneway_extreme

sizes:    [50, 100, 200]
per_pair: 3
master_seed: 314159

generation:
  network_type: drive
  service_time_minutes: [5, 15]
  tw_width_factor_range: [1.5, 3.0]
  vehicle_factor: 0.30
  capacity_buffer: 2.50
  demand_range: [1, 10]
  feasibility_probe_seconds: 60
  feasibility_max_attempts: 5
