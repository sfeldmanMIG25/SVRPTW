# City pool for instances/v1/.  Each entry: a place query for OSMnx + a topology tag.
# The tag is informational; OSMnx ID lock happens at generate-time via graph_sha256.
cities:
  - name: "Manhattan, NY"
    query: "Manhattan, New York, USA"
    topology: grid_oneway
  - name: "Paris, France"
    query: "Paris, France"
    topology: radial
  - name: "San Francisco, CA"
    query: "San Francisco, California, USA"
    topology: coastal_constrained
  - name: "Phoenix, AZ"
    query: "Phoenix, Arizona, USA"
    topology: sprawl
  - name: "Charleston, SC"
    query: "Charleston, South Carolina, USA"
    topology: colonial_dense
  - name: "Austin, TX"
    query: "Austin, Texas, USA"
    topology: midsize_grid
  - name: "Pittsburgh, PA"
    query: "Pittsburgh, Pennsylvania, USA"
    topology: midsize_radial
  - name: "Cambridge, MA"
    query: "Cambridge, Massachusetts, USA"
    topology: oneway_extreme

sizes:    [50, 100, 200, 500]
per_pair: 5
master_seed: 271828

generation:
  network_type: drive
  service_time_minutes: [5, 15]
  tw_width_factor_range: [1.5, 3.0]
  vehicle_factor: 0.30
  capacity_buffer: 1.40
  demand_range: [1, 10]
  feasibility_probe_seconds: 60
  feasibility_max_attempts: 5
