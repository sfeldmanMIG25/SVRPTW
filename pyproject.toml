[project]
name = "svrptw"
version = "0.0.1"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["instances/", "solutions/", ".venv/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
exclude = "(__pycache__|\\.venv|instances|solutions|graphify-out)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
