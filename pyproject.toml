[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvrp"
version = "0.1.0"
description = "Pip-installable VRPTW solver: heterogeneous fleets, full driver-hour rulesets, network-aware geometry, MIT-licensed."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OpenVRP contributors" },
]
requires-python = ">=3.10"
keywords = ["vrp", "vrptw", "routing", "vehicle-routing", "osm", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
network = [
    "networkx>=3.0",
    "osmnx>=1.6",
    "shapely>=2.0",
    "pyproj>=3.4",
]
pyvrp = [
    "pyvrp>=0.8",
]
viz = [
    "matplotlib>=3.6",
    "contextily>=1.3",
]
all = [
    "openvrp[network,pyvrp,viz]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.6",
    "ruff>=0.1",
    "jsonschema>=4.20",
    "pip-licenses>=4.3",
]

[project.urls]
Homepage = "https://github.com/openvrp/openvrp"
Issues = "https://github.com/openvrp/openvrp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openvrp*", "svrptw*"]
exclude = [
    "tests*", "tests_openvrp*", "docs*", "bench*", "scripts*",
    "instances*", "solutions*", "graphify-out*", "webui*",
    "examples*", "examples_openvrp*", "specs*", "WorldsFinestVRP*",
    "models*", "cache*", "data*", "lkh3_debug*",
]

[tool.setuptools.package-data]
openvrp = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["instances/", "solutions/", ".venv/", "__pycache__/", "graphify-out/", "WorldsFinestVRP/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
exclude = "(__pycache__|\\.venv|instances|solutions|graphify-out|WorldsFinestVRP)"

[[tool.mypy.overrides]]
module = "openvrp.schema.*"
strict = true
# disallow_any_explicit intentionally NOT set: pydantic models use
# dict[str, Any] for arbitrary metadata and Callable[[Any], None] for
# user-provided progress callbacks. --strict still enforces no-implicit-Any,
# no-untyped-defs, no-redundant-casts, etc.

[tool.pytest.ini_options]
testpaths = ["tests_openvrp", "tests"]
addopts = "-q"
markers = [
    "core_only: tests that must pass in core-deps-only env (no [network]/[pyvrp])",
    "conformance: SPEC-OPENVRP-04 §7 conformance suite",
    "slow: long-running benchmarks",
]
